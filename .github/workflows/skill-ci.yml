name: Rust guardrails validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.96.0'
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path tools/rust-guardrails/Cargo.toml --all -- --check
      - name: Test default AST engine
        run: cargo test --manifest-path tools/rust-guardrails/Cargo.toml --locked
      - name: Test dependency-free core
        run: cargo test --manifest-path tools/rust-guardrails/Cargo.toml --locked --no-default-features
      - name: Run opt-in Clippy integrations with default features
        run: cargo test --manifest-path tools/rust-guardrails/Cargo.toml --locked -- --ignored
      - name: Lint default engine
        run: cargo clippy --manifest-path tools/rust-guardrails/Cargo.toml --locked --all-targets -- -D warnings
      - name: Lint dependency-free core
        run: cargo clippy --manifest-path tools/rust-guardrails/Cargo.toml --locked --no-default-features --all-targets -- -D warnings
      - name: Compile ownership example
        run: rustc --edition 2021 --test examples/split_state.rs -o tools/rust-guardrails/target/split-state-test.exe
      - name: Test ownership example
        run: ./tools/rust-guardrails/target/split-state-test.exe
      - name: Compile typestate example
        run: rustc --edition 2021 --test examples/typestate.rs -o tools/rust-guardrails/target/typestate-test.exe
      - name: Test typestate example
        run: ./tools/rust-guardrails/target/typestate-test.exe
