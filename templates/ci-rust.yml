# Optional example workflow. Copy into .github/workflows/rust.yml and adapt feature matrix.
# The audit report is advisory; never hard-gate on syntactic findings.
name: Rust checks
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Candidate audit (advisory)
        run: cargo run --quiet --release --manifest-path .agents/skills/rust-engineering-guardrails/tools/rust-guardrails/Cargo.toml -- report . --profile service --format markdown --output rust-audit.md && cat rust-audit.md
      # Optional hard gate: only compiler errors and budgeted benchmark regressions are blockers.
      # - run: cargo run ... -- report . --with clippy --fail-on blocker
