# Optional example workflow. Copy into .github/workflows/rust.yml and adapt feature matrix.
# The audit report is advisory; never hard-gate on syntactic findings.
name: Rust checks
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Candidate audit (advisory)
        run: cargo run --quiet --release --manifest-path .agents/skills/rust-engineering-guardrails/tools/rust-guardrails/Cargo.toml -- report . --profile service --format markdown --output rust-audit.md && cat rust-audit.md
      # Optional hard gate: only compiler errors and budgeted benchmark regressions are blockers.
      # - run: cargo run ... -- report . --with clippy --fail-on blocker
      # Optional reviewed debt gate (requires a committed baseline and installed tool).
      # Never regenerate the baseline in this job. Configuration and accepted debt
      # must be reviewed; matching existing debt is not proof of correctness.
      # - name: New debt gate
      #   run: rust-guardrails report . --baseline rust-baseline.json --fail-on high --format sarif --output rust-audit.sarif
      # - name: Security policy gates (requires project-approved installed tools)
      #   run: |
      #     cargo audit
      #     cargo deny check
      #     cargo vet
      # Keep required security gates separate from saved-report imports. A saved
      # report is not proof of a current scan or of the current lockfile's identity.
